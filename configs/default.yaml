detection:
  model_path: yolo26n.pt
  confidence: 0.4
  target_classes:
    - person

tracking:   
  history_length: 30
  max_missing_frames: 30

events:
  line_crossing:
    enabled: true
    start: [50, 300]
    end: [600, 300]
    dead_zone_px: 5
    confirmation_frames: 3
    negative_to_positive: IN
    positive_to_negative: OUT

  zones:
    restricted-zone-1:
      polygon:
        - [100, 100]
        - [200, 100]
        - [200, 200]
        - [100, 200]
  intrusion:
    enabled: true
    zone_id: restricted-zone-1

  loitering:
    enabled: true
    zone_id: restricted-zone-1
    dwell_threshold_seconds: 5.0 

output:
  display: true
  codec: mp4v

logging:
  level: INFO
  event_jsonl_path: data/outputs/events.jsonl
