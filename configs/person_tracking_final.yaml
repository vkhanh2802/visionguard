detection:
  model_path: yolo26n.pt
  confidence: 0.30
  target_classes:
    - person

tracking:
  history_length: 30
  max_missing_frames: 30
  tracker_config: configs/bytetrack_week6.yaml
  continuity_enabled: false
  continuity_max_gap_frames: 5
  continuity_min_gap_frames: 2
  continuity_max_distance_px: 60
  continuity_confirmation_frames: 2
  continuity_ambiguity_margin_px: 15
  continuity_max_size_ratio: 2
  duplicate_suppression_enabled: false
  duplicate_confirmation_frames: 3
  duplicate_min_containment_ratio: 0.85
  duplicate_max_bottom_distance_px: 35
  duplicate_max_area_ratio: 3
  duplicate_max_motion_difference_px: 12
  duplicate_state_retention_frames: 5
  duplicate_max_handoff_gap_frames: 5

events:
  line_crossing:
    enabled: false
    start: [0, 0]
    end: [1, 0]
    dead_zone_px: 5
    confirmation_frames: 3
    negative_to_positive: IN
    positive_to_negative: OUT
  zones: {}
  intrusion:
    enabled: false
    zone_id: disabled
    entry_confirmation_frames: 1
    exit_confirmation_frames: 1
  loitering:
    enabled: false
    zone_id: disabled
    dwell_threshold_seconds: 5
    id_reassociation_frames: 0
    id_reassociation_distance_px: 0

output:
  display: false
  codec: mp4v
  encoder: ffmpeg_nvenc
  async_writer: true
  writer_queue_size: 4
  ffmpeg_path: ffmpeg
  nvenc_quality: 23

logging:
  level: INFO
  event_jsonl_path: null
  run_metadata_path: null

video:
  fps_override: null

database:
  path: data/visionguard.db
