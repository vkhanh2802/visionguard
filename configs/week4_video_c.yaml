detection:
  model_path: yolo26n.pt
  confidence: 0.4
  target_classes:
    - person

tracking:
  history_length: 30
  max_missing_frames: 30

events:
  line_crossing:
    enabled: true
    start: [50, 400]
    end: [1850, 400]
    dead_zone_px: 5.0
    confirmation_frames: 3
    negative_to_positive: IN
    positive_to_negative: OUT

  zones:
    restricted-zone-1:
      polygon:
        - [1400, 750]
        - [2050, 750]
        - [2350, 350]
        - [1600, 350]

  intrusion:
    enabled: true
    zone_id: restricted-zone-1
    entry_confirmation_frames: 6
    exit_confirmation_frames: 6

  loitering:
    enabled: true
    zone_id: restricted-zone-1
    dwell_threshold_seconds: 5.0

output:
  display: true
  codec: mp4v

logging:
  level: INFO
  event_jsonl_path: data/outputs/week5videoC.events.jsonl
  run_metadata_path: data/outputs/week5videoC.metadata.json

video:
  fps_override: null
