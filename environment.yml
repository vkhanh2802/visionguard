name: visionguard
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - ultralytics
      - opencv-python
      - pytest
      - pydantic >=2, <3
      - PyYAML >=6, <7
      - fastapi >=0.115, <1
      - uvicorn >=0.30, <1
      - httpx >=0.27, <1
      - redis >=5, <7
      - rq >=2, <3
